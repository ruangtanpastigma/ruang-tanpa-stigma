name: Deploy Ruang Tanpa Stigma to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate editorial publication gates
        run: |
          jq -e '.posts | type == "array"' dist/content/posts.json > /dev/null
          invalid_dates=$(jq '[.posts[] | select(.status == "published" and ((.published_at // "") == "" or (.reviewed_at // "") == ""))] | length' dist/content/posts.json)
          invalid_clinical=$(jq '[.posts[] | select(.status == "published" and .clinical_review_needed == true and (.review_status != "independently_reviewed" or (.reviewer // "") == ""))] | length' dist/content/posts.json)
          if [ "$invalid_dates" -gt 0 ]; then
            echo "Published content must include publication and review dates."
            exit 1
          fi
          if [ "$invalid_clinical" -gt 0 ]; then
            echo "Clinical content cannot be published before a completed independent review is recorded."
            exit 1
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp -a dist/. _site/
          jq '{posts: [.posts[] | select(.status == "published")]}' dist/content/posts.json > _site/content/posts.json
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
