<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#f7f0e4"/>
  <rect width="390" height="70" fill="#fffdf8"/>
  <line x1="0" y1="69" x2="390" y2="69" stroke="#c9cdbf"/>
  <circle cx="33" cy="35" r="21" fill="#5f7658"/>
  <text x="66" y="41" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#343d2d">Ruang Tanpa Stigma</text>
  <rect x="333" y="14" width="44" height="42" rx="8" fill="none" stroke="#343d2d"/>
  <text x="355" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#343d2d">☰</text>
  <line x1="23" y1="115" x2="48" y2="115" stroke="#a84539" stroke-width="3"/>
  <text x="59" y="120" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#a84539">EDUKASI · DUKUNGAN · KOMUNITAS</text>
  <text x="23" y="184" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#343d2d">HIV tidak</text>
  <text x="23" y="230" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#343d2d">mengurangi</text>
  <text x="23" y="276" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#343d2d">nilai seseorang.</text>
  <text x="23" y="326" font-family="Arial, sans-serif" font-size="15" fill="#41483d">Ruang untuk memahami HIV melalui</text>
  <text x="23" y="350" font-family="Arial, sans-serif" font-size="15" fill="#41483d">informasi yang dapat dipercaya,</text>
  <text x="23" y="374" font-family="Arial, sans-serif" font-size="15" fill="#41483d">percakapan yang lebih manusiawi, dan</text>
  <text x="23" y="398" font-family="Arial, sans-serif" font-size="15" fill="#41483d">dukungan tanpa penghakiman.</text>
  <rect x="23" y="435" width="150" height="50" rx="8" fill="#343d2d"/>
  <text x="49" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Mulai belajar</text>
  <rect x="184" y="435" width="143" height="50" rx="8" fill="none" stroke="#343d2d"/>
  <text x="222" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#343d2d">Tentang</text>
  <text x="23" y="526" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#46543d">Pahami HIV. Dukung sesama. Tanpa stigma.</text>
  <circle cx="195" cy="680" r="117" fill="#fff" stroke="#c9cdbf"/>
  <circle cx="195" cy="680" r="107" fill="#5f7658"/>
  <text x="195" y="676" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#fff">OFFICIAL</text>
  <text x="195" y="703" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#fff">LOGO</text>
