# Repository dan URL GitHub Pages sudah diisi. Ganti base_url setelah layanan
# autentikasi GitHub untuk CMS disiapkan. Jangan menyimpan client secret di file ini.
backend:
  name: github
  repo: ruangtanpastigma/ruang-tanpa-stigma
  branch: main
  base_url: https://YOUR-OAUTH-SERVICE.example

publish_mode: editorial_workflow
local_backend: true
site_url: https://ruangtanpastigma.github.io/ruang-tanpa-stigma/
display_url: https://ruangtanpastigma.github.io/ruang-tanpa-stigma/
logo_url: /ruang-tanpa-stigma/assets/images/ruang-tanpa-stigma-logo.jpeg
media_folder: dist/assets/uploads
public_folder: /ruang-tanpa-stigma/assets/uploads

collections:
  - name: website_content
    label: Artikel & Video
    files:
      - name: content_library
        label: Perpustakaan Konten
        file: dist/content/posts.json
        format: json
        fields:
          - label: Konten
            name: posts
            widget: list
            collapsed: true
            summary: "{{fields.title}} — {{fields.lang}} — {{fields.status}}"
            fields:
              - {label: Slug, name: slug, widget: string, hint: "Huruf kecil dan tanda hubung, misalnya memahami-u-equals-u"}
              - label: Bahasa
                name: lang
                widget: select
                options:
                  - {label: Bahasa Indonesia, value: id}
                  - {label: English, value: en}
              - label: Status
                name: status
                widget: select
                default: draft
                options:
                  - {label: Draft — belum terlihat publik, value: draft}
                  - {label: Published — terlihat publik, value: published}
              - label: Format
                name: type
                widget: select
                default: article
                options:
                  - {label: Artikel, value: article}
                  - {label: Video, value: video}
              - label: Kategori
                name: category
                widget: select
                options:
                  - {label: HIV dasar, value: hiv-dasar}
                  - {label: Tes & pencegahan, value: tes-pencegahan}
                  - {label: Pengobatan & U=U, value: pengobatan-uu}
                  - {label: Stigma & komunikasi, value: stigma-komunikasi}
                  - {label: Dukungan, value: dukungan}
                  - {label: Evidence, value: evidence}
              - {label: Judul, name: title, widget: string}
              - {label: Ringkasan, name: summary, widget: text, hint: "Satu atau dua kalimat untuk kartu artikel dan hasil pencarian."}
              - {label: Penulis, name: author, widget: string, default: Ruang Tanpa Stigma}
              - {label: Tanggal publikasi, name: published_at, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false, required: false}
              - {label: Terakhir ditinjau, name: reviewed_at, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false, required: false}
              - {label: Peninjau, name: reviewer, widget: string, required: false, hint: "Jangan mengisi nama peninjau profesional sebelum mereka benar-benar meninjau konten."}
              - {label: Tautan video YouTube, name: video_url, widget: string, required: false, hint: "Isi hanya untuk format Video."}
              - {label: Isi, name: body, widget: markdown}
              - label: Sumber
                name: sources
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.label}}"
                fields:
                  - {label: Nama sumber, name: label, widget: string}
                  - {label: URL sumber, name: url, widget: string}
